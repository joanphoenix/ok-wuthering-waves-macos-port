name: macOS runtime regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ok-script:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Read from the sync baseline so upstream syncs never have to edit this file.
      - name: Set the ok-script build version
        run: echo "OK_SCRIPT_BUILD_VERSION=$(jq -r .ok_script .github/upstream.json)+macos.1" >> "$GITHUB_ENV"
      - name: Install Mac dependencies
        run: python -m pip install -r requirements-macos.txt -e './ok-script[default,ocr,qt,web,dev]'
      - name: Test the application (all test_*.py and Test*.py modules)
        run: python -m pytest -q tests
      - name: Check ScreenCaptureKit capture is available on the runner
        run: python -c "from ok.device.capture_methods import macos_screencapturekit as s; assert s.available(), 'ScreenCaptureKit capture unavailable'"
      - name: Test the vendored ok-script suite
        run: python -m pytest -q ok-script/tests
      - name: Check every ok-script change is in MACOS_PATCHES.md
        run: python .github/scripts/sync_upstream.py --patches
