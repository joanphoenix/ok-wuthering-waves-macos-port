name: macOS runtime regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ok-script:.
      OK_SCRIPT_BUILD_VERSION: 3.0.13+macos.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mac dependencies
        run: python -m pip install -e './ok-script[default,ocr,qt,web,dev]' onnxruntime opencv-python polib dulwich==1.2.21
      - name: Test the application (all test_*.py and Test*.py modules)
        run: python -m pytest -q tests
      - name: Test the vendored ok-script suite
        run: python -m pytest -q ok-script/tests
