[build-system]
requires = ["setuptools>=77", "cython>=3"]
build-backend = "setuptools.build_meta"

[project]
name = "ok-ww"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dulwich==1.2.21",
    "mcp==2.3.0",
    "ok-script[ocr,qt]==3.0.14",
    "ok-pyside-minimal==6.12.0.post2",
    "onnxocr-ppocrv6>=0.0.1",
    "OpenCC==1.2.0",
    "openvino",
    "opencv-python",
    "playwright",
    "pyappify[standalone]>=1.0.20"
]

[project.optional-dependencies]
dev = [
    "polib",
    "pytest",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
web-test = [
    "ok-script[web]==3.0.14",
]

[tool.pytest.ini_options]
# Upstream names its unittest modules Test*.py (TestAbyssRestart.py, TestCloudCombatTarget.py, ...),
# which pytest skips by default. Without this only the few test_*.py files run.
python_files = ["test_*.py", "Test*.py"]
testpaths = ["tests"]
