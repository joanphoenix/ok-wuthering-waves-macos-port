name: "ok-ww"
uac: true
icon: "icons/icon.png"
website: "http://ok-script.com/ok-ww"
keep_releases: 30

profiles:
  - name: "China"
    git_url: "https://cnb.cool/ok-oldking/ok-ww-update2.git"
    admin: true
    main_script: "main.py"
    requires_python: "3.12"
    requirements: "requirements.txt"
    use_pythonw: true
    pip_args: "--no-deps"
    show_add_defender: true
    # PYTHONPATH: "your/default/path" # Optional, will be "" if missing

  - name: "Global"
    git_url: "https://github.com/ok-oldking/ok-ww-update.git"
    main_script: "main.py"
    requirements: "requirements.txt"



  # The macOS port. run_macos.sh selects it with PYAPPIFY_APP_PROFILE, so the
  # in-app updater installs the Mac packages. pip_args is set to keep the
  # first profile's --no-deps from being inherited: requirements-macos.txt
  # isn't a full pin list.
  - name: "macOS"
    requirements: "requirements-macos.txt"
    pip_args: "--upgrade-strategy only-if-needed"
